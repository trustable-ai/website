<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trustable - Private AI</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #071018;
        color: #fff;
        overflow-x: hidden;
      }

      .hero {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
        isolation: isolate;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(90deg, rgba(3, 10, 16, 0.2), transparent 38%),
          linear-gradient(180deg, rgba(3, 10, 16, 0.18), transparent 26%);
        pointer-events: none;
      }

      .hero__image {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .hero__copy {
        position: absolute;
        top: clamp(28px, 4.1vw, 42px);
        left: clamp(142px, 12vw, 164px);
        z-index: 2;
        width: calc(100vw - clamp(142px, 12vw, 164px) - 28px);
        text-shadow: 0 3px 18px rgba(0, 0, 0, 0.58);
      }

      .hero__title {
        display: flex;
        gap: 0.32em;
        align-items: baseline;
        margin: 0;
        color: #fff;
        font-size: clamp(24px, 3vw, 44px);
        font-weight: 780;
        line-height: 1.04;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .hero__accent {
        color: #ffd64d;
      }

      @media (orientation: portrait), (max-width: 720px) {
        .hero {
          min-height: 100svh;
        }

        .hero::after {
          background:
            linear-gradient(180deg, rgba(3, 10, 16, 0.22), transparent 28%),
            linear-gradient(180deg, transparent 58%, rgba(3, 10, 16, 0.28));
        }

        .hero__image {
          object-position: center top;
        }

        .hero__copy {
          top: clamp(150px, 14vh, 196px);
          left: 50%;
          width: min(88vw, 620px);
          transform: translateX(-50%);
          text-align: center;
        }

        .hero__title {
          flex-direction: column;
          gap: 0.08em;
          align-items: center;
          font-size: clamp(38px, 11vw, 72px);
          line-height: 1;
          white-space: normal;
        }
      }

      @media (max-width: 420px) {
        .hero__copy {
          width: min(86vw, 360px);
        }
      }
    </style>
  </head>
  <body>
    <main class="hero" aria-label="Trustable private AI landing page">
      <picture>
        <source srcset="mobile.png" media="(orientation: portrait), (max-width: 720px)">
        <img
          class="hero__image"
          src="desktop.png"
          alt="Trustable private AI workstation in a data center">
      </picture>

      <section class="hero__copy" aria-labelledby="hero-title">
        <h1 class="hero__title" id="hero-title">
          <span>Lovable-like experience</span>
          <span class="hero__accent">for Private AI</span>
        </h1>
      </section>
    </main>
  </body>
</html>
